name: Deploy Django to Render

on:
  push:
    branches: [main]
  workflow_dispatch:  # Optional: Manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}  # Use a PAT, not password!

      - name: Build & Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/scrumflow:latest .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/scrumflow:latest

      - name: Trigger Render Deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys"
        env:
          RENDER_SERVICE_ID: "your-service-id"  # Store in GitHub Secrets