# .github/workflows/deploy.yml
name: Build and Push to Docker Hub & Trigger Render Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Django App
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/scrumflow-backend ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/scrumflow-backend

      - name: Trigger Render Deploy Hooks
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
