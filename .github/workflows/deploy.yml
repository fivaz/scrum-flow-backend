# .github/workflows/deploy.yml
name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Django App
        run: |
          docker build -t fivaz/scrumflow-backend ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/backend

      - name: Build & Push Postgres DB
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/scrumflow-db ./postgres
          docker push ${{ secrets.DOCKER_USERNAME }}/scrumflow-db
